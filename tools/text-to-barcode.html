<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Barcode Converter</title>
    <link rel="stylesheet" type="text/css" href="../index.css" />
    <style>
      .text-to-qr {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
      }

      .qr-container {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        width: 90%;
        max-width: 450px;
        text-align: center;
      }

      .qr-header {
        margin-bottom: 30px;
      }

      .qr-header h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #00ff9d;
      }

      .qr-input {
        position: relative;
        margin-bottom: 25px;
      }

      .qr-input input {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .qr-input input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(0, 255, 157, 0.3);
      }

      .generate-btn {
        display: block;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(45deg, #00ff9d, #00ccff);
        color: #1a1a2e;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .generate-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
      }

      #result {
        margin: 40px 0 20px 0;
        text-align: center;
      }

      .barcode-output {
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        display: inline-block;
      }

      #barcode-output {
        display: none;
      }

      .qr-download button {
        padding: 10px 20px;
        background: transparent;
        border: 2px solid #00ff9d;
        color: #00ff9d;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .qr-download button:hover {
        background: rgba(0, 255, 157, 0.1);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="text-to-qr">
      <div class="qr-container">
        <div class="qr-header">
          <h1>Text to Barcode</h1>
          <p>Turn your text into a scannable barcode</p>
        </div>
        <div class="qr-input">
          <input
            type="text"
            id="text"
            placeholder="Enter text here..."
            required
          />
        </div>
        <button class="generate-btn" onclick="generateBarcode()">
          Generate Barcode
        </button>
        <div id="result">
          <div class="barcode-output" id="barcode-output">
            <canvas id="barcode"></canvas>
          </div>
        </div>
        <div class="qr-download">
          <button id="downloadBtn" style="display: none">
            Download Barcode
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script>
      function generateBarcode() {
        const text = document.getElementById("text").value.trim();
        const barcodeOutput = document.getElementById("barcode-output");
        const downloadBtn = document.getElementById("downloadBtn");
        const canvas = document.getElementById("barcode");

        if (text === "") {
          alert("Please enter some text to generate a barcode!");
          return;
        }

        JsBarcode(canvas, text, {
          format: "CODE128",
          lineColor: "#000000",
          width: 2,
          height: 100,
          displayValue: false,
        });

        barcodeOutput.style.display = "block";
        downloadBtn.style.display = "inline-block";
      }

      document
        .getElementById("downloadBtn")
        .addEventListener("click", function () {
          const canvas = document.getElementById("barcode");
          const link = document.createElement("a");
          link.href = canvas.toDataURL("image/png");
          link.download = "barcode.png";
          link.click();
        });
    </script>
  </body>
</html>
