<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw a Perfect Circle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #0a192f;
        color: #ffffff;
        overflow-x: hidden;
      }

      .navbar {
        position: fixed;
        width: 100%;
        padding: 20px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #001a3a;
        z-index: 1000;
        backdrop-filter: blur(10px);
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #fff;
      }

      .nav-links {
        display: flex;
        gap: 30px;
        list-style: none;
      }

      .nav-links a {
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        position: relative;
      }

      .nav-links a:hover {
        color: #00ff9d;
      }

      .nav-links a::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 3px;
        background: #00ff9d;
        transition: width 0.3s ease;
      }

      .nav-links a:hover::after {
        width: 100%;
      }

      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        background: #0a192f;
      }

      #drawCanvas {
        border: 2px solid #00ff9d;
        border-radius: 15px;
        cursor: crosshair;
        background: #12263b;
        box-shadow: 0 0 20px rgba(0, 255, 157, 0.1);
      }

      #score {
        font-size: 24px;
        margin-top: 20px;
        color: #fff;
        font-weight: bold;
        text-align: center;
        text-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
      }

      #message {
        font-size: 20px;
        margin-top: 10px;
        color: #ff4757;
        text-align: center;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      h1 {
        color: #00ff9d;
        font-size: 2.5em;
        margin-bottom: 30px;
        text-shadow: 0 0 10px #00ff9d;
        font-weight: lighter;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Circle Drawing Tool</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <div class="container">
      <h1>Draw a Perfect Circle</h1>
      <canvas id="drawCanvas" width="500" height="500"></canvas>
      <p id="score">Score: 0%</p>
      <p id="message"></p>
    </div>

    <script>
      const canvas = document.getElementById("drawCanvas");
      const ctx = canvas.getContext("2d");
      let drawing = false;
      let points = [];

      const MIN_POINTS = 10;
      const MIN_RADIUS = 50;

      canvas.addEventListener("mousedown", (e) => {
        drawing = true;
        points = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById("message").textContent = "";
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!drawing) return;
        points.push({ x: e.offsetX, y: e.offsetY });
        drawLivePath();
      });

      canvas.addEventListener("mouseup", () => {
        drawing = false;
        evaluateCircle();
      });

      function drawLivePath() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        points.forEach((point) => ctx.lineTo(point.x, point.y));
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#00ff9d";
        ctx.stroke();
      }

      function evaluateCircle() {
        if (points.length < MIN_POINTS) {
          document.getElementById("score").innerText = "Score: 0%";
          document.getElementById("message").textContent = "";
          return;
        }

        let sumX = 0,
          sumY = 0;
        points.forEach((p) => {
          sumX += p.x;
          sumY += p.y;
        });
        let centerX = sumX / points.length;
        let centerY = sumY / points.length;

        let distances = points.map((p) =>
          Math.hypot(p.x - centerX, p.y - centerY)
        );
        let avgRadius = distances.reduce((a, b) => a + b, 0) / distances.length;

        if (avgRadius < MIN_RADIUS) {
          document.getElementById("score").innerText = "";
          document.getElementById("message").textContent =
            "Circle is too small";
          return;
        }

        let deviation = Math.sqrt(
          distances
            .map((d) => (d - avgRadius) ** 2)
            .reduce((a, b) => a + b, 0) / distances.length
        );
        let score = Math.max(0, 100 - deviation * 5);
        score = Math.round(score);

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        points.forEach((point) => ctx.lineTo(point.x, point.y));
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#00ff9d";
        ctx.stroke();

        document.getElementById("score").innerText = `Score: ${score}%`;
        document.getElementById("message").textContent = "";

        if (score >= 90) {
          document.getElementById("score").style.color = "#00ff9d";
        } else if (score >= 70) {
          document.getElementById("score").style.color = "#76ff8a";
        } else {
          document.getElementById("score").style.color = "#ff4757";
        }
      }
    </script>
  </body>
</html>
