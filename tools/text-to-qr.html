<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to QR Code Converter</title>
    <link rel="stylesheet" type="text/css" href="../index.css" />
    <style>
      .text-to-qr {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
      }

      .qr-container {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        width: 90%;
        max-width: 450px;
        text-align: center;
      }

      .qr-header {
        margin-bottom: 30px;
      }

      .qr-header h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #00ff9d;
      }

      .qr-input {
        position: relative;
        margin-bottom: 25px;
      }

      .qr-input input {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .qr-input input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(0, 255, 157, 0.3);
      }

      .generate-btn {
        display: block;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(45deg, #00ff9d, #00ccff);
        color: #1a1a2e;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .generate-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
      }

      #result {
        margin: 40px 0 20px 0;
        text-align: center;
      }

      .qr-output {
        /* background: #ffffff; */
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        display: inline-block;
        /* border: 3px solid #000000; */
      }
      #qr-output {
        display: none; /* Hide the QR output div initially */
      }

      .qr-output canvas {
        display: block;
        margin: 0 auto;
        background: #ffffff;
      }

      .qr-download {
        display: block;
      }

      .qr-download button {
        padding: 10px 20px;
        background: transparent;
        border: 2px solid #00ff9d;
        color: #00ff9d;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .qr-download button:hover {
        background: rgba(0, 255, 157, 0.1);
        color: #fff;
      }

      @media (max-width: 480px) {
        .qr-container {
          padding: 25px;
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Sarath Molathoti</div>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="#blog">Blog</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="text-to-qr">
      <div class="qr-container">
        <div class="qr-header">
          <h1>Text to QR Code</h1>
          <p>Turn your text into a scannable QR code</p>
        </div>
        <div class="qr-input">
          <input
            type="text"
            id="text"
            placeholder="Enter text here..."
            required
          />
        </div>
        <button class="generate-btn" onclick="generateQRCode()">
          Generate QR Code
        </button>
        <div id="result">
          <div class="qr-output" id="qr-output"></div>
        </div>
        <div class="qr-download">
          <button id="downloadBtn" style="display: none">
            Download QR Code
          </button>
        </div>
      </div>
    </div>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script>
      function generateQRCode() {
        const text = document.getElementById("text").value.trim();
        const qrOutput = document.getElementById("qr-output");
        const downloadBtn = document.getElementById("downloadBtn");

        if (text === "") {
          alert("Please enter some text to generate QR Code!");
          return;
        }

        // Clear existing QR code and hide output container
        qrOutput.innerHTML = "";
        qrOutput.style.display = "none"; // Hide QR output until QR is generated

        // Generate QR Code
        const qr = new QRCode(qrOutput, {
          text: text,
          width: 128,
          height: 128,
          colorDark: "#000000", // Black QR code
          colorLight: "#ffffff", // White background
        });

        // Ensure the QR code is generated before displaying the output
        setTimeout(() => {
          const canvas = document.querySelector("#qr-output canvas");
          if (!canvas) return;

          const qrSize = canvas.width; // Original QR code size
          const borderSize = 20; // Border thickness
          const newSize = qrSize + borderSize * 2; // New canvas size

          // Create a new canvas with border
          const newCanvas = document.createElement("canvas");
          newCanvas.width = newSize;
          newCanvas.height = newSize;
          const ctx = newCanvas.getContext("2d");

          // Draw white background
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, newSize, newSize);

          // Draw black border
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, newSize, borderSize); // Top
          ctx.fillRect(0, newSize - borderSize, newSize, borderSize); // Bottom
          ctx.fillRect(0, 0, borderSize, newSize); // Left
          ctx.fillRect(newSize - borderSize, 0, borderSize, newSize); // Right

          // Draw the QR code inside the bordered canvas
          ctx.drawImage(canvas, borderSize, borderSize);

          // Replace the displayed QR code with the new one
          qrOutput.innerHTML = "";
          qrOutput.appendChild(newCanvas);

          // Show the QR output container
          qrOutput.style.display = "block";

          // Show download button
          downloadBtn.style.display = "inline-block";
        }, 100);
      }

      // Updated download function
      document
        .getElementById("downloadBtn")
        .addEventListener("click", function () {
          const canvas = document.querySelector("#qr-output canvas");
          if (canvas) {
            const imageUrl = canvas.toDataURL("image/png");
            const link = document.createElement("a");
            link.download = "qrcode.png";
            link.href = imageUrl;
            link.click();
          }
        });
    </script>
  </body>
</html>
