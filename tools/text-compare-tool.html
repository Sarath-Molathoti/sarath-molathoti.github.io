<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Comparison Tool</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f4;
            --border: #e1e4e8;
            --border-dark: #d0d4d9;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --text-muted: #8b949e;
            --accent: #0969da;
            --accent-hover: #0860ca;
            --success: #1a7f37;
            --success-bg: #dafbe1;
            --danger: #cf222e;
            --danger-bg: #ffebe9;
            --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.04);
            --shadow: 0 1px 3px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
            --shadow-md: 0 4px 12px rgba(31, 35, 40, 0.1);
            --radius: 6px;
            --radius-lg: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .logo h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--border-dark);
        }

        /* Main - This is the key fix */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
            width: 100%;
            flex: 1 0 auto;
        }

        /* Options Bar */
        .options-bar {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .toggle-group {
            display: flex;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .toggle-btn {
            padding: 6px 12px;
            border: none;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border-right: 1px solid var(--border);
        }

        .toggle-btn:last-child {
            border-right: none;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: white;
        }

        .toggle-btn:hover:not(.active) {
            background: var(--bg-secondary);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent);
        }

        /* Editor Container */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .editor-panel {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: border-color 0.15s ease;
        }

        .editor-panel:focus-within {
            border-color: var(--accent);
        }

        .editor-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .editor-title i {
            color: var(--text-muted);
            font-size: 12px;
        }

        .editor-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-original {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .badge-modified {
            background: var(--success-bg);
            color: var(--success);
        }

        .editor-actions {
            display: flex;
            gap: 4px;
        }

        .editor-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            font-size: 12px;
        }

        .editor-action-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .editor-body {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 14px;
            border: none;
            background: transparent;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-primary);
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .char-count {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--border-dark);
        }

        .btn-danger {
            background: var(--bg-primary);
            color: var(--danger);
            border-color: var(--border);
        }

        .btn-danger:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Results Section */
        .results-section {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        .results-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .results-title i {
            color: var(--text-muted);
        }

        .stats-group {
            display: flex;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .stat-item.added .dot { background: var(--success); }
        .stat-item.removed .dot { background: var(--danger); }
        .stat-item.unchanged .dot { background: var(--text-muted); }

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .result-panel {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .result-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-title i {
            color: var(--text-muted);
            font-size: 12px;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .copy-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-dark);
        }

        .copy-btn.copied {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success);
        }

        .result-content {
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.7;
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .result-content::-webkit-scrollbar {
            width: 6px;
        }

        .result-content::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .result-content::-webkit-scrollbar-thumb {
            background: var(--border-dark);
            border-radius: 3px;
        }

        /* Diff Highlights */
        .diff-added {
            background: var(--success-bg);
            padding: 1px 2px;
            border-radius: 3px;
        }

        .diff-removed {
            background: var(--danger-bg);
            padding: 1px 2px;
            border-radius: 3px;
            text-decoration: line-through;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-primary);
            color: white;
            padding: 12px 16px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i { font-size: 14px; }
        .toast.success i { color: #4ade80; }
        .toast.error i { color: #f87171; }

        /* Footer - Fixed to bottom */
        footer {
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            flex-shrink: 0;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* Loading */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .editor-container,
            .results-container {
                grid-template-columns: 1fr;
            }

            .options-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .results-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }

        @media (max-width: 600px) {
            main { padding: 16px; }

            .action-buttons {
                flex-direction: column;
            }

            .btn { width: 100%; justify-content: center; }

            .footer-content {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
   <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-code-compare"></i>
                </div>
                <h1>Text Compare</h1>
            </div>
            <div class="header-actions">
                <a href="../home.html" class="icon-btn" title="Home" style="text-decoration: none; color: inherit;">
                    <i class="fas fa-home"></i>
                </a>
                <button class="icon-btn" title="Help">
                    <i class="fas fa-question"></i>
                </button>
                <button class="icon-btn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="options-bar">
            <div class="option-group">
                <span class="option-label">Compare by:</span>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-mode="words">Words</button>
                    <button class="toggle-btn" data-mode="chars">Characters</button>
                    <button class="toggle-btn" data-mode="lines">Lines</button>
                </div>
            </div>
            <div class="option-group">
                <span class="option-label">View:</span>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-view="side">Side by Side</button>
                    <button class="toggle-btn" data-view="inline">Unified</button>
                </div>
            </div>
            <div class="option-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="ignoreCase">
                    Ignore case
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="ignoreWhitespace">
                    Ignore whitespace
                </label>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor-panel">
                <div class="editor-header">
                    <div class="editor-title">
                        <i class="fas fa-file-lines"></i>
                        <span>Original</span>
                        <span class="editor-badge badge-original">Old</span>
                    </div>
                    <div class="editor-actions">
                        <button class="editor-action-btn" title="Paste" onclick="pasteText('text1')">
                            <i class="fas fa-paste"></i>
                        </button>
                        <button class="editor-action-btn" title="Clear" onclick="clearText('text1')">
                            <i class="fas fa-times"></i>
                        </button>
                        <button class="editor-action-btn" title="Upload" onclick="document.getElementById('file1').click()">
                            <i class="fas fa-upload"></i>
                        </button>
                        <input type="file" id="file1" hidden accept=".txt,.md,.json,.js,.html,.css,.xml">
                    </div>
                </div>
                <div class="editor-body">
                    <textarea id="text1" placeholder="Paste original text here..."></textarea>
                    <div class="char-count" id="count1">0 chars</div>
                </div>
            </div>

            <div class="editor-panel">
                <div class="editor-header">
                    <div class="editor-title">
                        <i class="fas fa-file-lines"></i>
                        <span>Modified</span>
                        <span class="editor-badge badge-modified">New</span>
                    </div>
                    <div class="editor-actions">
                        <button class="editor-action-btn" title="Paste" onclick="pasteText('text2')">
                            <i class="fas fa-paste"></i>
                        </button>
                        <button class="editor-action-btn" title="Clear" onclick="clearText('text2')">
                            <i class="fas fa-times"></i>
                        </button>
                        <button class="editor-action-btn" title="Upload" onclick="document.getElementById('file2').click()">
                            <i class="fas fa-upload"></i>
                        </button>
                        <input type="file" id="file2" hidden accept=".txt,.md,.json,.js,.html,.css,.xml">
                    </div>
                </div>
                <div class="editor-body">
                    <textarea id="text2" placeholder="Paste modified text here..."></textarea>
                    <div class="char-count" id="count2">0 chars</div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="compareButton">
                <i class="fas fa-code-compare"></i>
                Compare
            </button>
            <button class="btn btn-secondary" id="swapButton">
                <i class="fas fa-right-left"></i>
                Swap
            </button>
            <button class="btn btn-danger" id="resetButton">
                <i class="fas fa-rotate-left"></i>
                Reset
            </button>
        </div>

        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <div class="results-title">
                    <i class="fas fa-chart-simple"></i>
                    <span>Results</span>
                </div>
                <div class="stats-group">
                    <div class="stat-item added">
                        <span class="dot"></span>
                        <span id="addedCount">0 added</span>
                    </div>
                    <div class="stat-item removed">
                        <span class="dot"></span>
                        <span id="removedCount">0 removed</span>
                    </div>
                    <div class="stat-item unchanged">
                        <span class="dot"></span>
                        <span id="unchangedCount">0 unchanged</span>
                    </div>
                </div>
            </div>

            <div class="results-container" id="resultsContainer">
                <div class="result-panel">
                    <div class="result-header">
                        <div class="result-title">
                            <i class="fas fa-minus"></i>
                            Original
                        </div>
                        <button class="copy-btn" onclick="copyResult('originalResult')">
                            <i class="fas fa-copy"></i>
                            Copy
                        </button>
                    </div>
                    <div class="result-content" id="originalResult"></div>
                </div>

                <div class="result-panel">
                    <div class="result-header">
                        <div class="result-title">
                            <i class="fas fa-plus"></i>
                            Modified
                        </div>
                        <button class="copy-btn" onclick="copyResult('modifiedResult')">
                            <i class="fas fa-copy"></i>
                            Copy
                        </button>
                    </div>
                    <div class="result-content" id="modifiedResult"></div>
                </div>
            </div>

            <div class="result-panel" id="inlineContainer" style="display: none; margin-top: 16px;">
                <div class="result-header">
                    <div class="result-title">
                        <i class="fas fa-stream"></i>
                        Unified View
                    </div>
                    <button class="copy-btn" onclick="copyResult('inlineResult')">
                        <i class="fas fa-copy"></i>
                        Copy
                    </button>
                </div>
                <div class="result-content" id="inlineResult"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <span>© 2024 Text Compare Tool</span>
            <div class="footer-links">
                <a href="#">Documentation</a>
                <a href="#">GitHub</a>
                <a href="#">Feedback</a>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success</span>
    </div>

    <script>
        // DOM Elements
        const text1 = document.getElementById('text1');
        const text2 = document.getElementById('text2');
        const compareButton = document.getElementById('compareButton');
        const resetButton = document.getElementById('resetButton');
        const swapButton = document.getElementById('swapButton');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const inlineContainer = document.getElementById('inlineContainer');

        let compareMode = 'words';
        let viewMode = 'side';

        // Character count
        text1.addEventListener('input', () => updateCount('text1', 'count1'));
        text2.addEventListener('input', () => updateCount('text2', 'count2'));

        function updateCount(textId, countId) {
            const text = document.getElementById(textId).value;
            document.getElementById(countId).textContent = `${text.length} chars`;
        }

        // Toggle buttons
        document.querySelectorAll('.toggle-group').forEach(group => {
            group.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    if (this.dataset.mode) compareMode = this.dataset.mode;
                    if (this.dataset.view) {
                        viewMode = this.dataset.view;
                        updateView();
                    }
                });
            });
        });

        function updateView() {
            if (viewMode === 'side') {
                resultsContainer.style.display = 'grid';
                inlineContainer.style.display = 'none';
            } else {
                resultsContainer.style.display = 'none';
                inlineContainer.style.display = 'block';
            }
        }

        // Compare
        compareButton.addEventListener('click', function() {
            const original = text1.value;
            const modified = text2.value;

            if (!original && !modified) {
                showToast('Please enter text to compare', 'error');
                return;
            }

            this.innerHTML = '<span class="spinner"></span> Comparing...';
            this.disabled = true;

            setTimeout(() => {
                const ignoreCase = document.getElementById('ignoreCase').checked;
                let textA = ignoreCase ? original.toLowerCase() : original;
                let textB = ignoreCase ? modified.toLowerCase() : modified;

                if (document.getElementById('ignoreWhitespace').checked) {
                    textA = textA.replace(/\s+/g, ' ').trim();
                    textB = textB.replace(/\s+/g, ' ').trim();
                }

                let diff;
                switch (compareMode) {
                    case 'chars': diff = Diff.diffChars(textA, textB); break;
                    case 'lines': diff = Diff.diffLines(textA, textB); break;
                    default: diff = Diff.diffWords(textA, textB);
                }

                let originalHTML = '', modifiedHTML = '', inlineHTML = '';
                let added = 0, removed = 0, unchanged = 0;

                diff.forEach(part => {
                    const escaped = escapeHtml(part.value);
                    if (part.added) {
                        modifiedHTML += `<span class="diff-added">${escaped}</span>`;
                        inlineHTML += `<span class="diff-added">${escaped}</span>`;
                        added += part.value.length;
                    } else if (part.removed) {
                        originalHTML += `<span class="diff-removed">${escaped}</span>`;
                        inlineHTML += `<span class="diff-removed">${escaped}</span>`;
                        removed += part.value.length;
                    } else {
                        originalHTML += escaped;
                        modifiedHTML += escaped;
                        inlineHTML += escaped;
                        unchanged += part.value.length;
                    }
                });

                document.getElementById('originalResult').innerHTML = originalHTML || '<em style="color:var(--text-muted)">Empty</em>';
                document.getElementById('modifiedResult').innerHTML = modifiedHTML || '<em style="color:var(--text-muted)">Empty</em>';
                document.getElementById('inlineResult').innerHTML = inlineHTML || '<em style="color:var(--text-muted)">Empty</em>';

                document.getElementById('addedCount').textContent = `${added} added`;
                document.getElementById('removedCount').textContent = `${removed} removed`;
                document.getElementById('unchangedCount').textContent = `${unchanged} unchanged`;

                resultsSection.style.display = 'block';
                updateView();

                this.innerHTML = '<i class="fas fa-code-compare"></i> Compare';
                this.disabled = false;

                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                showToast('Comparison complete', 'success');
            }, 300);
        });

        // Reset
        resetButton.addEventListener('click', () => {
            text1.value = '';
            text2.value = '';
            document.getElementById('count1').textContent = '0 chars';
            document.getElementById('count2').textContent = '0 chars';
            resultsSection.style.display = 'none';
            showToast('Cleared', 'success');
        });

        // Swap
        swapButton.addEventListener('click', () => {
            const temp = text1.value;
            text1.value = text2.value;
            text2.value = temp;
            updateCount('text1', 'count1');
            updateCount('text2', 'count2');
            showToast('Texts swapped', 'success');
        });

        // Helpers
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function pasteText(id) {
            navigator.clipboard.readText().then(text => {
                document.getElementById(id).value = text;
                updateCount(id, id === 'text1' ? 'count1' : 'count2');
                showToast('Pasted', 'success');
            }).catch(() => showToast('Unable to paste', 'error'));
        }

        function clearText(id) {
            document.getElementById(id).value = '';
            updateCount(id, id === 'text1' ? 'count1' : 'count2');
        }

        function copyResult(id) {
            const content = document.getElementById(id).innerText;
            navigator.clipboard.writeText(content).then(() => {
                const btn = document.querySelector(`button[onclick="copyResult('${id}')"]`);
                btn.classList.add('copied');
                btn.innerHTML = '<i class="fas fa-check"></i> Copied';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                }, 2000);
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = toast.querySelector('i');
            document.getElementById('toastMessage').textContent = message;
            
            toast.className = 'toast ' + type;
            icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // File upload
        document.getElementById('file1').addEventListener('change', e => handleFile(e, 'text1'));
        document.getElementById('file2').addEventListener('change', e => handleFile(e, 'text2'));

        function handleFile(e, id) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById(id).value = e.target.result;
                    updateCount(id, id === 'text1' ? 'count1' : 'count2');
                    showToast(`Loaded: ${file.name}`, 'success');
                };
                reader.readAsText(file);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                compareButton.click();
            }
        });
    </script>
</body>
</html>
