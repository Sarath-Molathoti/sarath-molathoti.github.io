<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Portal - Sarath</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Orbitron", sans-serif;
        background: #000;
        color: #00ffcc;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
      }

      #preloader {
        z-index: 10;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .glitch-text {
        font-size: 3rem;
        position: relative;
        text-transform: uppercase;
        color: #00ffcc;
        animation: glitch 2s infinite;
      }

      @keyframes glitch {
        0% {
          text-shadow: 2px 2px red, -2px -2px blue;
        }
        25% {
          text-shadow: -2px 2px red, 2px -2px blue;
        }
        50% {
          text-shadow: 2px -2px red, -2px 2px blue;
        }
        75% {
          text-shadow: -2px -2px red, 2px 2px blue;
        }
        100% {
          text-shadow: 2px 2px red, -2px -2px blue;
        }
      }

      .progress-bar {
        margin-top: 20px;
        width: 300px;
        height: 6px;
        background: #111;
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-bar-inner {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #00ffcc, #00f2ff);
        animation: load 4s forwards;
      }

      @keyframes load {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="bgCanvas"></canvas>

    <div id="preloader">
      <div class="glitch-text" id="glitchText">S</div>
      <div class="progress-bar">
        <div class="progress-bar-inner"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const canvas = document.getElementById("bgCanvas");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      const renderer = new THREE.WebGLRenderer({ canvas });

      renderer.setSize(window.innerWidth, window.innerHeight);

      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 2000;
      const positions = [];

      for (let i = 0; i < starsCount; i++) {
        positions.push((Math.random() - 0.5) * 600);
        positions.push((Math.random() - 0.5) * 600);
        positions.push((Math.random() - 0.5) * 600);
      }

      starsGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      const starsMaterial = new THREE.PointsMaterial({
        color: 0x00ffcc,
        size: 1,
      });
      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);

      camera.position.z = 5;

      function animate() {
        requestAnimationFrame(animate);
        stars.rotation.y += 0.0005;
        renderer.render(scene, camera);
      }
      animate();

      // Typing effect
      const text = "Sarath Molathoti";
      let i = 1;
      const glitchText = document.getElementById("glitchText");

      function typeNextLetter() {
        if (i <= text.length) {
          glitchText.innerText = text.slice(0, i);
          i++;
          setTimeout(typeNextLetter, 150);
        }
      }

      setTimeout(typeNextLetter, 500);

      // End preloader after animation
      setTimeout(() => {
        document.getElementById("preloader").style.transition =
          "opacity 1s ease";
        document.getElementById("preloader").style.opacity = 0;
        setTimeout(() => {
          document.getElementById("preloader").style.display = "none";
        }, 1000);
      }, 5000);
      setTimeout(() => {
        window.location.href = "index.html";
      }, 3000); // Change timing based on your animation
    </script>
  </body>
</html>
