<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Portal - Sarath</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a192f;
        color: #00ff9d;
      }

      #preloader {
        z-index: 10;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 25, 47, 1);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 1s ease;
      }

      .glitch-text {
        font-size: 3rem;
        color: #00ff9d;
        text-shadow: 0 0 10px #00ff9d, 0 0 20px #00ff9d;
        animation: glow-flicker 2s infinite ease-in-out;
      }

      @keyframes glow-flicker {
        0%,
        100% {
          text-shadow: 0 0 10px #00ff9d, 0 0 20px #00ff9d;
        }
        50% {
          text-shadow: 0 0 5px #00ff9d, 0 0 10px #00ff9d;
        }
      }

      .progress-bar {
        margin-top: 30px;
        width: 250px;
        height: 6px;
        background: #003a55;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 0 10px #00ff9d;
      }

      .progress-bar-inner {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #00ff9d, #00f2ff);
        animation: load 3s forwards ease-in-out;
      }

      @keyframes load {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="glitch-text" id="glitchText">S</div>
      <div class="progress-bar">
        <div class="progress-bar-inner"></div>
      </div>
    </div>

    <script>
      // Typing animation
      const fullText = "Sarath Molathoti";
      const glitchText = document.getElementById("glitchText");
      let current = 1;

      function type() {
        if (current <= fullText.length) {
          glitchText.textContent = fullText.slice(0, current);
          current++;
          setTimeout(type, 120);
        }
      }

      setTimeout(type, 400);

      // Fade out loader and redirect
      setTimeout(() => {
        document.getElementById("preloader").style.opacity = 0;
        setTimeout(() => {
          document.getElementById("preloader").style.display = "none";
          window.location.href = "index.html";
        }, 1000);
      }, 3500); // Adjust duration as needed
    </script>
  </body>
</html>
